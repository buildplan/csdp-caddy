name: Build and Push CSDP-Caddy

on:
  repository_dispatch:
    types: [caddy-release, bouncer-release, proxy-release]
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths:
      - '.github/workflows/build-and-push.yml'
      - 'caddy.Dockerfile'

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: csdp-caddy
      DEFAULT_GO_VERSION: 1.26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # --- Fetch Versions ---
      - name: Fetch Latest Caddy Version
        run: |
          RECENT_TAGS=$(gh api /repos/caddyserver/caddy/releases --jq '.[0:5] | .[].tag_name')
          FOUND_TAG=""
          FOUND_VERSION=""
          echo "Looking for the newest Caddy release that is actually published on Docker Hub..."
          for TAG in $RECENT_TAGS; do
            VERSION=$(echo "${TAG}" | sed 's/^v//')
            echo "Checking Caddy ${VERSION}..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://hub.docker.com/v2/repositories/library/caddy/tags/${VERSION}-alpine")
            if [ "$HTTP_STATUS" == "200" ]; then
              echo "Success! Caddy ${VERSION} is available on Docker Hub."
              FOUND_TAG=$TAG
              FOUND_VERSION=$VERSION
              break # Stop the loop, we found our version!
            else
              echo "⚠️ Caddy ${VERSION} is not on Docker Hub yet. Falling back to the previous release..."
            fi
          done
          if [ -z "$FOUND_VERSION" ]; then
            echo "❌ ERROR: Could not find ANY of the 5 most recent Caddy releases on Docker Hub."
            exit 1
          fi
          echo "CADDY_TAG=${FOUND_TAG}" >> $GITHUB_ENV
          echo "CADDY_VERSION=${FOUND_VERSION}" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch Latest Bouncer Version
        run: |
          BOUNCER_TAG=$(gh api /repos/hslatman/caddy-crowdsec-bouncer/releases/latest --jq .tag_name)
          BOUNCER_VERSION=$(echo "${BOUNCER_TAG}" | sed 's/^v//')
          echo "BOUNCER_VERSION=${BOUNCER_VERSION}" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch Latest Proxy Version
        run: |
          PROXY_TAG=$(gh api /repos/lucaslorentz/caddy-docker-proxy/releases/latest --jq .tag_name)
          PROXY_VERSION=$(echo "${PROXY_TAG}" | sed 's/^v//')
          echo "PROXY_VERSION=${PROXY_VERSION}" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Determine Go Version ---
      - name: Fetch Required Go Version
        id: go_version
        run: |
          GO_VERSION_URL="https://raw.githubusercontent.com/caddyserver/caddy/${{ env.CADDY_TAG }}/go.mod"
          DYNAMIC_GO_VERSION=$(curl -sL --fail "${GO_VERSION_URL}" | grep -oP "^go \K[0-9]+\.[0-9]+" || true)
          if [[ -n "${DYNAMIC_GO_VERSION}" ]]; then
            echo "GO_VERSION=${DYNAMIC_GO_VERSION}" >> $GITHUB_ENV
            echo "Using Go floating tag: ${DYNAMIC_GO_VERSION}"
          else
            echo "GO_VERSION=${{ env.DEFAULT_GO_VERSION }}" >> $GITHUB_ENV
          fi

      # --- Docker Setup ---
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Build & Push ---
      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./caddy.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
            CADDY_VERSION=${{ env.CADDY_VERSION }}
            BOUNCER_VERSION=${{ env.BOUNCER_VERSION }}
            PROXY_VERSION=${{ env.PROXY_VERSION }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.CADDY_VERSION }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.CADDY_VERSION }}-proxy-${{ env.PROXY_VERSION }}-bouncer-${{ env.BOUNCER_VERSION }}
          labels: |
            org.opencontainers.image.title=CSDP-Caddy
            org.opencontainers.image.description=Caddy + CrowdSec + Docker Proxy
            org.opencontainers.image.version=${{ env.CADDY_VERSION }}-P${{ env.PROXY_VERSION }}-B${{ env.BOUNCER_VERSION }}

      # --- Release ---
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.CADDY_VERSION }}-P${{ env.PROXY_VERSION }}
          name: "Caddy v${{ env.CADDY_VERSION }} (Proxy v${{ env.PROXY_VERSION }})"
          body: |
            **Automated Build**
            - Caddy: v${{ env.CADDY_VERSION }}
            - CrowdSec Bouncer: v${{ env.BOUNCER_VERSION }}
            - Docker Proxy: v${{ env.PROXY_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Cleanup ---
      - name: Clean up old GHCR images
        uses: quartx-analytics/ghcr-cleaner@v1
        with:
          owner-type: user
          token: ${{ secrets.PAT_TOKEN }}
          repository-owner: ${{ github.repository_owner }}
          repository-name: ${{ env.IMAGE_NAME }}
          delete-untagged: true
          keep-at-most: 15
          skip-tags: "*-proxy-*-bouncer-*"

